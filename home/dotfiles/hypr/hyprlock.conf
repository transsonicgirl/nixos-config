# Minimal lock: dark Catppuccin Mocha background + password field.

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    color = rgb(11111b)   # crust
}

input-field {
    monitor = DP-1
    size = 300, 50
    position = 0, 0
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = rgb(cba6f7)   # mauve
    inner_color = rgb(1e1e2e)   # base
    font_color = rgb(cdd6f4)    # text
    check_color = rgb(f9e2af)   # yellow while PAM checks
    fail_color = rgb(f38ba8)    # red on wrong password
    placeholder_text = <i>password</i>
    fade_on_empty = true
}

label {
    monitor = DP-1
    text = $TIME
    font_size = 64
    font_family = IoskeleyMono Nerd Font Mono
    color = rgb(cdd6f4)
    position = 0, 120
    halign = center
    valign = center
}
